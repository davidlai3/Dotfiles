#set -g @plugin 'seebi/tmux-colors-solarized'
#set -g @colors-solarized 'dark'
#set -g @plugin "arcticicestudio/nord-tmux"

set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'light'

#set -g default-terminal "screen-256color"
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Reduce Escape-key delay so vim mode switching feels instant
set -sg escape-time 10

# scrolling
set -g mouse on
setw -g mode-keys vi

# copying
# Let tmux forward copies to the *outer* terminal as OSC 52 escape sequences.
# Over ssh that outer terminal is the one on the local machine, so a copy in a
# remote tmux lands in the local clipboard with no X forwarding involved.
set -g set-clipboard on
# Advertise the capability even when the terminfo entry for $TERM omits it.
set -ga terminal-features ",*:clipboard"
# tmux's default update-environment list has SSH_CONNECTION but not SSH_TTY,
# which is what nvim keys its OSC 52 detection off of; panes created after a
# re-attach need the fresh value.
set -ga update-environment SSH_TTY

# copy-pipe still fills the tmux buffer (and so still triggers the OSC 52 above)
# on top of running the command, so the xclip pipe is a local-only extra: it
# fills the X clipboard when there is a display, and is skipped when there
# isn't one, as on a headless ssh host.
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel '[ -n "$DISPLAY" ] && exec xclip -selection clipboard -in || cat >/dev/null'
bind-key -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel '[ -n "$DISPLAY" ] && exec xclip -selection clipboard -in || cat >/dev/null'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear '[ -n "$DISPLAY" ] && exec xclip -selection clipboard -in || cat >/dev/null'

unbind-key C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Name auto-created sessions with the mex (lowest unused non-negative integer)
# instead of tmux's monotonic counter.
set-hook -g session-created 'run-shell -b ~/Dotfiles/tmux/mex-session.sh'

run '~/.tmux/plugins/tpm/tpm'


