# kitty — chosen over gnome-terminal because VTE 0.68 (what Ubuntu 22.04 ships)
# has no OSC 52 handler at all, so copies made in a remote tmux/nvim over ssh
# had no way to reach this machine's clipboard. kitty implements OSC 52, which
# is what tmux/.tmux.conf and nvim/lua/vim-options.lua emit.

# kitty's own TERM value needs a terminfo entry that remote hosts mostly do not
# have, which would break ssh to the course VMs. xterm-256color is present
# everywhere and still advertises Ms (the OSC 52 capability tmux looks for), so
# the clipboard keeps working while ssh stays boring.
term xterm-256color

# Allow programs to *write* the clipboard (this is the OSC 52 write path, and
# the whole point of the switch). Reads stay behind a prompt: a remote host
# being able to silently exfiltrate the clipboard is the reason terminals
# gate this in the first place.
#
# no-append is load-bearing, not tidiness. kitty accumulates successive OSC 52
# writes into one buffer by default (Window.clipboard_control), so a second copy
# arrives as first+second concatenated rather than replacing it — verified on
# 0.21.2 for both the nvim and tmux copy paths. Neither nvim nor tmux sends the
# empty-payload reset that would clear the buffer, so the terminal has to be the
# one told not to append.
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask no-append

# Copies over ssh can be larger than the conservative default chunk allowance.
clipboard_max_size 64

font_size 11.0
scrollback_lines 10000
enable_audio_bell no
confirm_os_window_close 0

include ${HOME}/Dotfiles/kitty/catppuccin-mocha.conf

# gruvbox light, to match `set -g @tmux-gruvbox 'light'` in .tmux.conf
#background            #fbf1c7
#foreground            #3c3836
#cursor                #3c3836
#selection_background  #d5c4a1
#selection_foreground  #3c3836

#color0  #fbf1c7
#color8  #928374
#color1  #cc241d
#color9  #9d0006
#color2  #98971a
#color10 #79740e
#color3  #d79921
#color11 #b57614
#color4  #458588
#color12 #076678
#color5  #b16286
#color13 #8f3f71
#color6  #689d6a
#color14 #427b58
