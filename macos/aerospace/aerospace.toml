# Only used for window snapping hotkeys. Old full config is in git history.
config-version = 2
start-at-login = true
auto-reload-config = true

[mode.main.binding]
    alt-h = 'exec-and-forget ~/Dotfiles/macos/aerospace/snap.sh left'
    alt-l = 'exec-and-forget ~/Dotfiles/macos/aerospace/snap.sh right'
    alt-k = 'exec-and-forget ~/Dotfiles/macos/aerospace/snap.sh full'

# Never tile; windows stay where you put them.
[[on-window-detected]]
    if = 'true'
    run = 'layout floating'
